name: HILD installation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: First-install regression suite
        run: python -m pytest -q tests/test_install_hild.py
      - name: Python syntax
        run: python -m py_compile HILD/scripts/install_hild.py
